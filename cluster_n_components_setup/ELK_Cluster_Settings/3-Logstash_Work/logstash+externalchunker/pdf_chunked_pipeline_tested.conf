# lab_reports_pipeline.conf
# Structured PDF pipeline for lab reports
# Calls pdf_chunker.py which does section-aware chunking

input {
  file {
    path              => "E:/logstash+externalchunker/lab_reports/*.pdf"
    start_position    => "beginning"
    sincedb_path      => "NUL"
    mode              => "read"
    file_completed_action   => "log"
    file_completed_log_path => "E:/logstash+externalchunker/logstash_completed_pdfs.log"
    ecs_compatibility => "disabled"
    codec             => plain
  }
}

filter {

  # Step 1: get file path and remove binary PDF content
  mutate {
    add_field => {
      "pdf_path" => "%{[path]}"
      "filename" => "%{[path]}"
    }
    remove_field => ["message"]
  }

  # Drop if path not resolved
  if [pdf_path] == "" or [pdf_path] == "%{[path]}" {
    drop { }
  }

  # Drop non-PDF lines
  if !([pdf_path] =~ /\.pdf$/) and !([pdf_path] =~ /\.PDF$/) {
    drop { }
  }

  # Step 2: call Python chunker - deduplicate so each PDF is processed once
  ruby {
    init => '
      $processed_lab_pdfs = {} unless defined?($processed_lab_pdfs)
    '
    code => '
      require "open3"
      require "json"

      pdf_path = event.get("pdf_path").to_s.strip

      if $processed_lab_pdfs[pdf_path]
        event.cancel
        next
      end

      $processed_lab_pdfs[pdf_path] = true

      script = "E:/logstash+externalchunker/pdf_chunker.py"
      logger.warn("PROCESSING: #{pdf_path}")

      stdout_str, stderr_str, status = Open3.capture3("python", script, pdf_path)

      unless stderr_str.strip.empty?
        logger.warn("STDERR: #{stderr_str[0..300]}")
      end

      if status.success? && !stdout_str.strip.empty?
        chunks = stdout_str.strip.split("\n").map { |line|
          begin
            JSON.parse(line)
          rescue JSON::ParserError => e
            logger.warn("JSON parse error: #{e.message}")
            nil
          end
        }.compact

        event.set("chunks",      chunks)
        event.set("chunk_count", chunks.length)
        event.set("parse_error", nil)
        logger.warn("OK: #{File.basename(pdf_path)} -> #{chunks.length} chunks")
      else
        event.set("chunks",      [])
        event.set("chunk_count", 0)
        event.set("parse_error", stderr_str.strip[0..400])
        event.tag("_chunker_failed")
        logger.warn("FAILED: #{File.basename(pdf_path)} | #{stderr_str[0..200]}")
      end
    '
  }

  # Step 3: drop failures
  if "_chunker_failed" in [tags] {
    drop { }
  }

  if [chunk_count] == 0 {
    drop { }
  }

  # Step 4: fan out - one event per chunk
  split {
    field => "chunks"
  }

  # Step 5: promote chunk fields to top-level
  ruby {
    code => '
      chunk = event.get("chunks")
      if chunk.is_a?(Hash)
        chunk.each { |k, v| event.set(k, v) }
      end
      event.remove("chunks")
    '
  }

  # Step 6: drop empty chunks
  if ![chunk_text] {
    drop { }
  }

  if [chunk_text] == "" {
    drop { }
  }

  # Step 7: stable document ID - upsert safe on re-run
  fingerprint {
    source              => ["filename", "chunk_index"]
    target              => "[@metadata][fingerprint]"
    method              => "SHA1"
    concatenate_sources => true
  }

  # Step 8: add timestamp and clean up
  mutate {
    add_field    => { "ingested_at" => "%{@timestamp}" }
    remove_field => ["host", "path"]
  }

}

output {
  elasticsearch {
    hosts       => ["http://localhost:9200"]
    ssl_enabled => false
    index       => "lab-reports-chunks"
    document_id => "%{[@metadata][fingerprint]}"
    action      => "index"
  }

  stdout {
    codec => rubydebug { metadata => false }
  }
}