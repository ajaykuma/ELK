# ─────────────────────────────────────────────────────────────────────────────
# academic_pdf_pipeline.conf
#
# Logstash pipeline for academic / research paper PDFs.
# Companion to academic_pdf_chunker.py.
#
# Differences from pdf_chunked_pipeline.conf (lab reports):
#   1. Watches a different folder  (/home/hdu/datasets/academic_pdfs)
#   2. Calls academic_pdf_chunker.py  (not pdf_chunker.py)
#   3. Indexes into a different ES index  (academic-papers-chunks)
#   4. Mapping has doc_title, doc_year, doc_venue, doc_type instead of
#      patient_id, diagnosis, abnormal_tests etc.
#   5. No ingest pipeline — all transformation done in the chunker script
#
# Setup:
#   mkdir -p /home/hdu/datasets/academic_pdfs
#   cp BI_approaches.pdf Time-Series*.pdf Walmarts*.pdf /home/hdu/datasets/academic_pdfs/
#   cp academic_pdf_chunker.py /home/hdu/logstash/scripts/
#   chmod +x /home/hdu/logstash/scripts/academic_pdf_chunker.py
#   bin/logstash -f academic_pdf_pipeline.conf
# ─────────────────────────────────────────────────────────────────────────────

input {
  file {
    # ── Watch the academic PDFs folder ────────────────────────────────────
    path           => "/home/hdu/datasets/academic_pdfs/**/*.pdf"
    start_position => "beginning"

    # sincedb tracks processed files — won't re-ingest on restart
    # Set to /dev/null to always re-process all PDFs (useful for testing)
    sincedb_path   => "/home/hdu/.logstash_sincedb_academic"

    # read mode: process the whole file as one event then close
    # (vs tail mode which follows appended lines like a log file)
    mode           => "read"

    file_completed_action   => "log"
    file_completed_log_path => "/home/hdu/logstash_academic_completed.log"

    codec => plain   # each discovered PDF fires one event; message = file path
  }
}

filter {
  # ── Step 1: get the file path from file input metadata ────────────────────
  mutate {
    copy      => { "[log][file][path]" => "pdf_path" }
    add_field => { "filename" => "%{[log][file][path]}" }
  }

  # ── Step 2: call the academic chunker Python script ───────────────────────
  # Script outputs one JSON line per chunk to stdout.
  # stderr captures any extraction errors.
  ruby {
    code => '
      require "open3"
      require "json"

      pdf_path = event.get("pdf_path").to_s.strip
      script   = "/home/hdu/logstash/scripts/academic_pdf_chunker.py"

      stdout_str, stderr_str, status = Open3.capture3(
        "python3", script, pdf_path
      )

      if status.success? && !stdout_str.strip.empty?
        chunks = stdout_str.strip.split("\n").map { |line|
          begin
            JSON.parse(line)
          rescue JSON::ParserError => e
            nil
          end
        }.compact

        event.set("chunks",      chunks)
        event.set("chunk_count", chunks.length)
        event.set("parse_error", nil)

        # Log how many chunks were produced per file
        logger.info("academic_pdf_pipeline: #{pdf_path} → #{chunks.length} chunks")
      else
        event.set("chunks",      [])
        event.set("chunk_count", 0)
        event.set("parse_error", stderr_str.strip)
        event.tag("_chunker_failed")
        logger.warn("academic_pdf_pipeline: chunker failed for #{pdf_path}: #{stderr_str.strip}")
      end
    '
  }

  # ── Step 3: fan out — one Logstash event per chunk ────────────────────────
  split {
    field => "chunks"
  }

  # ── Step 4: promote chunk fields to top-level event fields ────────────────
  ruby {
    code => '
      chunk = event.get("chunks")
      if chunk.is_a?(Hash)
        chunk.each { |k, v| event.set(k, v) }
      end
      event.remove("chunks")
      event.remove("message")    # raw file-input payload — not needed in ES
    '
  }

  # ── Step 5: drop failed or empty events ───────────────────────────────────
  if "_chunker_failed" in [tags] or [chunk_count] == 0 {
    drop { }
  }

  # Also drop if chunk_text is missing or too short after promotion
  if ![chunk_text] or [chunk_text] == "" {
    drop { }
  }

  # ── Step 6: stable document ID ────────────────────────────────────────────
  # SHA1 of (filename + chunk_index) → re-running the pipeline upserts
  # existing documents instead of creating duplicates.
  fingerprint {
    source              => ["filename", "chunk_index"]
    target              => "[@metadata][fingerprint]"
    method              => "SHA1"
    concatenate_sources => true
  }

  # ── Step 7: add ingestion timestamp ──────────────────────────────────────
  mutate {
    add_field => { "ingested_at" => "%{@timestamp}" }
  }
}

output {
  # ── Primary: Elasticsearch ────────────────────────────────────────────────
  elasticsearch {
    hosts => [
      "https://localhost:9200",
      "https://localhost:9201",
      "https://localhost:9202"
    ]
    user     => "elastic"
    password => "9_W6d34GiGU8gKoZfLlO"

    ssl_enabled                 => true
    ssl_certificate_authorities => [
      "/home/hdu/elasticsearch/config/certs/http_ca.crt"
    ]

    # Separate index from lab reports — different mapping, different use case
    index => "academic-papers-chunks"

    # Fingerprint as document_id ensures upsert on re-run (no duplicates)
    document_id => "%{[@metadata][fingerprint]}"
    action      => "index"
  }

  # ── Debug: print chunk summary to terminal ────────────────────────────────
  # Shows doc_title, section, chunk_index for every indexed chunk.
  # Remove or comment out in production to reduce noise.
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
