# academic_pdf_pipeline_final2.conf
# Fix: deduplicate file paths in Ruby using a global hash
# Each PDF path is only processed once even though file input
# fires many events (one per binary chunk of the PDF)
# pipeline.workers set to 1 to avoid race conditions on the global hash

input {
  file {
    path           => "E:/logstash+externalchunker/academic_pdfs/*.pdf"
    start_position => "beginning"
    mode           => "read"
    sincedb_path   => "NUL"
    file_completed_action   => "log"
    file_completed_log_path => "E:/logstash+externalchunker/completed.log"
    ecs_compatibility => "disabled"
    codec => plain
  }
}

filter {

  # Get the file path - remove binary message content immediately
  mutate {
    add_field => {
      "pdf_path" => "%{[path]}"
      "filename" => "%{[path]}"
    }
    remove_field => ["message"]
  }

  # Drop if path field was not resolved
  if [pdf_path] == "" or [pdf_path] == "%{[path]}" {
    drop { }
  }

  # Drop non-PDF paths
  if !([pdf_path] =~ /\.pdf$/) and !([pdf_path] =~ /\.PDF$/) {
    drop { }
  }

  # Deduplicate: only process each PDF path once
  # Uses a global Ruby hash shared across all events in the pipeline
  ruby {
    init => '
      # Global hash to track already-processed PDF paths
      # Persists for the lifetime of the Logstash process
      $processed_pdfs = {} unless defined?($processed_pdfs)
    '
    code => '
      require "open3"
      require "json"

      pdf_path = event.get("pdf_path").to_s.strip

      # If already processed this path, drop the event
      if $processed_pdfs[pdf_path]
        event.cancel
        next
      end

      # Mark as processed immediately to block other workers
      $processed_pdfs[pdf_path] = true

      script = "E:/logstash+externalchunker/academic_pdf_chunker.py"
      logger.warn("PROCESSING: #{pdf_path}")

      stdout_str, stderr_str, status = Open3.capture3("python", script, pdf_path)

      unless stderr_str.strip.empty?
        logger.warn("STDERR: #{stderr_str[0..300]}")
      end

      if status.success? && !stdout_str.strip.empty?
        chunks = stdout_str.strip.split("\n").map { |line|
          begin
            JSON.parse(line)
          rescue JSON::ParserError => e
            logger.warn("JSON parse error: #{e.message}")
            nil
          end
        }.compact

        event.set("chunks",      chunks)
        event.set("chunk_count", chunks.length)
        event.set("parse_error", nil)
        logger.warn("OK: #{File.basename(pdf_path)} -> #{chunks.length} chunks")
      else
        event.set("chunks",      [])
        event.set("chunk_count", 0)
        event.set("parse_error", stderr_str.strip[0..400])
        event.tag("_chunker_failed")
        logger.warn("FAILED: #{File.basename(pdf_path)} | #{stderr_str[0..200]}")
      end
    '
  }

  if "_chunker_failed" in [tags] {
    drop { }
  }

  if [chunk_count] == 0 {
    drop { }
  }

  # Fan out - one event per chunk
  split {
    field => "chunks"
  }

  # Promote chunk fields to top-level
  ruby {
    code => '
      chunk = event.get("chunks")
      if chunk.is_a?(Hash)
        chunk.each { |k, v| event.set(k, v) }
      end
      event.remove("chunks")
    '
  }

  if ![chunk_text] {
    drop { }
  }

  if [chunk_text] == "" {
    drop { }
  }

  fingerprint {
    source              => ["filename", "chunk_index"]
    target              => "[@metadata][fingerprint]"
    method              => "SHA1"
    concatenate_sources => true
  }

  mutate {
    add_field    => { "ingested_at" => "%{@timestamp}" }
    remove_field => ["host", "path"]
  }

}

output {
  elasticsearch {
    hosts       => ["http://localhost:9200"]
    ssl_enabled => false
    index       => "academic-papers-chunks"
    document_id => "%{[@metadata][fingerprint]}"
    action      => "index"
  }

  stdout {
    codec => rubydebug { metadata => false }
  }
}
