# ─────────────────────────────────────────────────────────────────────────────
# pdf_chunked_pipeline.conf
#
# What this does differently from your original:
#   1. Uses file input (sincedb) instead of exec+find — watches the pdf_folder
#      continuously and only picks up NEW or CHANGED files, not all files every hour.
#   2. Shells out to a Python chunker script that:
#        - Extracts text with pdfplumber (same as es_ingest_semantic.py)
#        - Splits into structured sections OR fixed-size character chunks
#        - Optionally embeds with sentence-transformers
#        - Writes chunks as newline-delimited JSON to stdout
#   3. The ruby filter parses that JSON stream and creates one Logstash event
#      per chunk (not one per PDF).
#   4. Each chunk event gets its own ES document with all metadata fields.
#
# Requirements:
#   pip install pdfplumber sentence-transformers --break-system-packages
#   Place pdf_chunker.py alongside this config (path set in CHUNKER_SCRIPT below)
#
# Usage:
#   bin/logstash -f pdf_chunked_pipeline.conf
# ─────────────────────────────────────────────────────────────────────────────

input {
  # ── file input: watches the folder, triggers on new/modified PDFs ──────────
  # sincedb_path tracks which files have already been processed so Logstash
  # doesn't re-ingest on restart. Set to /dev/null to always re-process.
  file {
    path            => "<path>/datasets/pdfs/**/*.pdf"   # recursive glob
    start_position  => "beginning"
    sincedb_path    => "<path>/.logstash_sincedb_pdfs"
    mode            => "read"           # read mode: process file then close (not tail)
    file_completed_action => "log"      # log completed files; use "delete" to auto-remove
    file_completed_log_path => "<path>/logstash_completed_pdfs.log"
    codec           => plain            # each file triggers one event; message = file path
    # file input in read mode sets [log][file][path] — we rename it below
  }
}

filter {
  # ── Step 1: extract the file path from the file input metadata ─────────────
  mutate {
    # [log][file][path] is set by the file input plugin in read mode
    copy   => { "[log][file][path]" => "pdf_path" }
    add_field => { "filename" => "%{[log][file][path]}" }
  }

  # ── Step 2: shell out to Python chunker, capture newline-delimited JSON ────
  # The Python script (pdf_chunker.py, see companion file) accepts a PDF path
  # and writes one JSON object per line to stdout, e.g.:
  #   {"chunk_index":0,"section":"Header","chunk_text":"...","patient_id":"P001",...}
  #   {"chunk_index":1,"section":"Complete Blood Count","chunk_text":"...",...}
  #
  # We use exec filter (runs per-event) rather than input exec so it fires
  # once per PDF file discovered, not on a fixed interval.
  ruby {
    code => '
      require "open3"
      require "json"

      pdf_path    = event.get("pdf_path").to_s.strip
      chunker_script = "<path>/logstash/scripts/pdf_chunker.py"

      # Run the Python chunker; capture stdout (JSON lines) and stderr
      stdout_str, stderr_str, status = Open3.capture3(
        "python3", chunker_script, pdf_path
      )

      if status.success? && !stdout_str.strip.empty?
        # Parse each line as a JSON chunk object
        chunks = stdout_str.strip.split("\n").map { |line|
          begin
            JSON.parse(line)
          rescue JSON::ParserError
            nil
          end
        }.compact

        # Store the array of chunks on the event — split filter will fan them out
        event.set("chunks", chunks)
        event.set("chunk_count", chunks.length)
        event.set("parse_error", nil)
      else
        event.set("chunks", [])
        event.set("parse_error", stderr_str.strip)
        event.tag("_chunker_failed")
      end
    '
  }

  # ── Step 3: fan out — one event per chunk ──────────────────────────────────
  # split walks the chunks array and creates a new event for each element,
  # copying all other fields. After this, [chunks] on each event = one chunk hash.
  split {
    field => "chunks"
  }

  # ── Step 4: promote chunk fields to top-level event fields ─────────────────
  ruby {
    code => '
      chunk = event.get("chunks")
      if chunk.is_a?(Hash)
        chunk.each { |k, v| event.set(k, v) }
      end
      # Clean up the raw array field — not needed in ES
      event.remove("chunks")
      event.remove("message")           # original file-input message body (binary)
    '
  }

  # ── Step 5: drop failed events (no chunks extracted) ──────────────────────
  if "_chunker_failed" in [tags] or [chunk_count] == 0 {
    drop { }
  }

  # ── Step 6: set a stable document ID = filename + chunk_index ─────────────
  # This means re-running the pipeline on the same PDF upserts rather than
  # creating duplicates.
  fingerprint {
    source        => ["filename", "chunk_index"]
    target        => "[@metadata][fingerprint]"
    method        => "SHA1"
    concatenate_sources => true
  }

  # ── Step 7: timestamp ──────────────────────────────────────────────────────
  mutate {
    add_field => { "ingested_at" => "%{@timestamp}" }
  }
}

output {
  # ── Primary: Elasticsearch ─────────────────────────────────────────────────
  elasticsearch {
    hosts => [
      "https://localhost:9200",
      "https://localhost:9201",
      "https://localhost:9202"
    ]
    user     => "elastic"
    password => "9_W6d34GiGU8gKoZfLlO"

    ssl_enabled                  => true
    ssl_certificate_authorities  => [
      "<path>/elasticsearch/config/certs/http_ca.crt"
    ]

    index           => "lab-reports-chunks"

    # Use fingerprint as the document ID — ensures upsert on re-run
    document_id     => "%{[@metadata][fingerprint]}"
    action          => "index"           # "index" = upsert behaviour with doc_id

    # No ingest pipeline needed — all transformation happens in this filter
  }

  # ── Debug: print each chunk event to terminal ──────────────────────────────
  stdout {
    codec => rubydebug {
      # Only print key fields — embedding vector is huge, skip it
      metadata => false
    }
  }
}
